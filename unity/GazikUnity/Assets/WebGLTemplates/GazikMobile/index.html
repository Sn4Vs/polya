<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ёжик Газик</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#1a231e;font-family:system-ui,sans-serif}#unity-canvas{position:fixed;left:env(safe-area-inset-left,0px);top:calc(env(safe-area-inset-top,0px) + 52px);width:calc(100% - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px));height:calc(100% - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - 52px);display:block;outline:none;touch-action:none}
#loading{position:fixed;inset:0;display:grid;place-content:center;text-align:center;background:radial-gradient(ellipse,#5d5541,#1c2822);color:#f1e8ce;z-index:5;transition:opacity .5s}#loading.done{opacity:0;pointer-events:none}#progress{width:230px;height:7px;appearance:none;border:0;border-radius:9px;margin:20px auto;accent-color:#c5ca93}
#loading h1{font:400 34px Georgia,serif;margin:0 0 10px}#loading p{font-size:14px;opacity:.8}#auth{display:none;position:fixed;inset:0;background:#101b16c9;backdrop-filter:blur(12px);z-index:8;place-items:center;padding:20px}#auth.show{display:grid}.card{position:relative;background:linear-gradient(135deg,#304237,#192b23);color:#f3eddc;width:min(420px,100%);padding:30px;border:1px solid #b8c4a033;border-radius:26px;box-shadow:0 30px 80px #0008}.card h2{font-weight:500}.card p{font-size:14px;line-height:1.6;color:#becbbc}label{display:block;margin-top:14px;font-size:13px}input,button{font:inherit}input{width:100%;margin:5px 0 8px;padding:14px;border-radius:13px;background:#101e18;border:1px solid #9eb89b44;color:#fff;font-size:16px}button{border:0;border-radius:13px;background:#c2cf9f;color:#213026;padding:13px 20px;cursor:pointer}#login{width:100%;margin-top:12px}#auth-close{position:absolute;right:10px;top:10px;background:transparent;color:#e5ead8;padding:6px 10px}#auth-state{min-height:30px;font-size:13px;padding-top:15px;color:#e1c89d}#back{position:fixed;top:calc(env(safe-area-inset-top,0px) + 4px);left:calc(env(safe-area-inset-left,0px) + 12px);min-height:44px;z-index:3;font-size:13px;padding:8px 12px;background:#14221abb;color:#e7e6d2}
</style></head><body>
<canvas id="unity-canvas" tabindex="-1"></canvas><button id="back" type="button">‹ на сайт</button>
<div id="loading"><h1>Ёжик Газик</h1><p>готовим уютный домик…</p><progress id="progress" max="1" value="0"></progress><p id="status">загрузка игры</p></div>
<div id="auth"><form class="card" id="auth-form"><button type="button" id="auth-close" aria-label="Закрыть">×</button><h2>Облачный прогресс</h2><p>Используется тот же аккаунт, что на основном сайте. Локальная игра не заменит облачное сохранение: сначала загрузим его.</p><label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required><label for="password">Пароль</label><input id="password" type="password" autocomplete="current-password" required><button type="submit" id="login">войти и продолжить</button><div id="auth-state" role="status"></div></form></div>
<script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore-compat.js"></script>
<script src="cloud.js"></script>
<script>
var canvas=document.getElementById('unity-canvas'),loading=document.getElementById('loading');
var config={dataUrl:'Build/{{{ DATA_FILENAME }}}',frameworkUrl:'Build/{{{ FRAMEWORK_FILENAME }}}',codeUrl:'Build/{{{ CODE_FILENAME }}}',streamingAssetsUrl:'StreamingAssets',companyName:'ForZvezdochka',productName:'Газик',productVersion:'0.4.0',devicePixelRatio:Math.min(devicePixelRatio||1,1.5)};
var loader=document.createElement('script');loader.src='Build/{{{ LOADER_FILENAME }}}';loader.onerror=function(){document.getElementById('status').textContent='Не удалось загрузить сборку. Проверь адрес и Web-сервер.';};loader.onload=function(){createUnityInstance(canvas,config,function(p){document.getElementById('progress').value=p;}).then(function(instance){window.unityInstance=instance;if(window.GazikFirebaseBridge&&window.GazikFirebaseBridge.resume)window.GazikFirebaseBridge.resume();loading.classList.add('done');}).catch(function(e){document.getElementById('status').textContent='Ошибка запуска: '+e;});};document.body.appendChild(loader);
document.getElementById('back').onclick=function(){location.href='../';};
</script></body></html>
